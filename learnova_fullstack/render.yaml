services:
  - type: web
    name: learnova-backend
    env: python
    plan: starter
    branch: main
    root: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./learnova.db
      - key: SECRET_KEY
        value: change-me-change-this-to-a-secret
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
    disk:
      size_gb: 1
      mount_path: /data